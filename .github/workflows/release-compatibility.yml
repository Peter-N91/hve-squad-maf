name: Release compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions: {}

concurrency:
  group: release-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-acceptance:
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
