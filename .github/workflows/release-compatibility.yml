name: Release compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions: {}

concurrency:
  group: release-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate public documentation links
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          class Page(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.ids = set()
                  self.links = []
                  self.feed(source.read_text(encoding="utf-8"))

              def handle_starttag(self, tag, attributes):
                  values = dict(attributes)
                  if "id" in values:
                      if values["id"] in self.ids:
                          raise ValueError(f"Duplicate HTML id: {values['id']}")
                      self.ids.add(values["id"])
                  for name in ("href", "src"):
                      if values.get(name):
                          self.links.append(values[name])

          root = Path("docs").resolve()
          pages = {source.resolve(): Page(source) for source in root.glob("*.html")}
          if root / "index.html" not in pages:
              raise SystemExit("docs/index.html is required.")
          asset_types = {".css", ".js", ".svg", ".png", ".jpg", ".jpeg", ".webp", ".ico"}
          for source, page in pages.items():
              for link in page.links:
                  url = urlsplit(link)
                  if url.scheme or url.netloc:
                      continue
                  target = (source.parent / unquote(url.path)).resolve() if url.path else source
                  if not target.is_relative_to(root) or not target.is_file():
                      raise SystemExit(f"{source.name}: missing or nonpublic target {link}")
                  relative = target.relative_to(root)
                  public_asset = relative.parts[0] == "assets" and target.suffix.lower() in asset_types
                  if target not in pages and not public_asset:
                      raise SystemExit(f"{source.name}: target is excluded from Pages: {link}")
                  if url.fragment and target in pages and unquote(url.fragment) not in pages[target].ids:
                      raise SystemExit(f"{source.name}: missing anchor {link}")
          print(f"Validated local links and anchors across {len(pages)} public pages.")
      - name: Build and run offline tests
        run: dotnet test HveSquad.AgentFramework.slnx --configuration Release --nologo --verbosity minimal
      - name: Build NuGet package
        run: dotnet pack src/HveSquad.AgentFramework --configuration Release --no-build --output artifacts

  released-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ['v0.16.2', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the tested artifact package manager
        run: python -m pip install --disable-pip-version-check apm-cli==0.18.0
      - name: Exercise real released contracts with a scripted model
        env:
          HVE_SQUAD_RELEASE_VERSION: ${{ matrix.release }}
          HVE_SQUAD_REQUIRE_RELEASE_TESTS: 'true'
          # Job-scoped read-only token: authenticate public release metadata requests
          # instead of sharing the runner IP's small anonymous GitHub API quota.
          HVE_SQUAD_RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet test tests/HveSquad.AgentFramework.Tests
          --configuration Release --nologo --verbosity normal
          --filter Category=ReleaseCompatibility
      - name: Report the compatibility boundary
        if: always()
        shell: pwsh
        env:
          RELEASE_SELECTOR: ${{ matrix.release }}
        run: |
          "## HVE Squad release contracts: $env:RELEASE_SELECTOR" >> $env:GITHUB_STEP_SUMMARY
          "Resolves a published stable release to its commit, then installs its pinned APM dependency graph. Never consumes main." >> $env:GITHUB_STEP_SUMMARY
          "Exercises native default/full-profile workflows with a scripted model. This is a contract check, not a live-model quality guarantee. A failure requires adapter maintenance; this workflow never silently publishes or changes consumer state." >> $env:GITHUB_STEP_SUMMARY
