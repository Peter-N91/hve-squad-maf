name: Reviewed HVE Squad release alignment

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: hve-squad-release-alignment
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      action: ${{ steps.evaluate.outputs.action }}
      alignment_mode: ${{ steps.evaluate.outputs.alignment_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the tested artifact package manager
        run: python -m pip install --disable-pip-version-check apm-cli==0.18.0
      - name: Evaluate the published stable candidate without write rights
        id: evaluate
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HVE_SQUAD_RELEASE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_APM_PAT_MICROSOFT: ${{ github.token }}
          APM_ALLOW_PROTOCOL_FALLBACK: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $Tool = [IO.Path]::Combine('tools', 'HveSquad.ReleaseSync')
          $Report = [IO.Path]::Combine('artifacts', 'release-sync', 'report.json')
          $PrepReport = [IO.Path]::Combine('artifacts', 'release-sync', 'alignment-prep.json')
          dotnet build $Tool --configuration Release --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'ReleaseSync build failed.' }
          dotnet run --project $Tool --configuration Release --no-build -- inspect --head $env:EXPECTED_HEAD --output $Report
          if ($LASTEXITCODE -ne 0) { throw 'Stable candidate evaluation failed; no proposal was authorized.' }
          $Result = Get-Content -LiteralPath $Report -Raw | ConvertFrom-Json
          if ($Result.action -notin @('up-to-date', 'current-evaluated', 'candidate')) { throw 'Unknown evaluation action.' }
          "action=$($Result.action)" >> $env:GITHUB_OUTPUT
          $AlignmentMode = 'none'
          if ($Result.action -eq 'candidate') {
            dotnet run --project $Tool --configuration Release --no-build -- prepare-alignment --report $Report --output $PrepReport
            if ($LASTEXITCODE -ne 0) { throw 'Candidate alignment preparation check failed.' }
            $Prep = Get-Content -LiteralPath $PrepReport -Raw | ConvertFrom-Json
            $AlignmentMode = $Prep.status
          }
          "alignment_mode=$AlignmentMode" >> $env:GITHUB_OUTPUT
          "## Official stable release alignment" >> $env:GITHUB_STEP_SUMMARY
          "Action: $($Result.action). Alignment mode: $AlignmentMode. Initial blockers: $($Result.promotionBlockers.Count)." >> $env:GITHUB_STEP_SUMMARY
          "Observation drift is advisory; absent baseline/answer judging is not a mechanical pass or failure." >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve read-only evaluation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evaluation
          path: artifacts/release-sync/*.json
          if-no-files-found: error
          retention-days: 30

  validate:
    needs: evaluate
    if: needs.evaluate.outputs.action == 'candidate' && needs.evaluate.outputs.alignment_mode == 'prepared'
    name: validate-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the tested artifact package manager
        run: python -m pip install --disable-pip-version-check apm-cli==0.18.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evaluation
          path: artifacts/release-sync
      - name: Prepare candidate alignment and build solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Tool = [IO.Path]::Combine('tools', 'HveSquad.ReleaseSync')
          $Report = [IO.Path]::Combine('artifacts', 'release-sync', 'report.json')
          $Prep = [IO.Path]::Combine('artifacts', 'release-sync', 'validate-prep.json')
          dotnet run --project $Tool --configuration Release -- prepare-alignment --report $Report --output $Prep
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply candidate alignment in validation workspace.' }
          dotnet build HveSquad.AgentFramework.slnx --configuration Release --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Candidate aligned build failed.' }
          $Result = Get-Content -LiteralPath $Report -Raw | ConvertFrom-Json
          "HVE_SQUAD_RELEASE_VERSION=$($Result.candidate.tag)" >> $env:GITHUB_ENV
          "HVE_SQUAD_RELEASE_COMMIT=$($Result.candidate.commitSha)" >> $env:GITHUB_ENV
      - name: Run full candidate release contracts and capture observations
        shell: pwsh
        env:
          HVE_SQUAD_REQUIRE_RELEASE_TESTS: 'true'
          HVE_SQUAD_RELEASE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_APM_PAT_MICROSOFT: ${{ github.token }}
          APM_ALLOW_PROTOCOL_FALLBACK: '1'
          HVE_SQUAD_OBSERVATION_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Project = [IO.Path]::Combine('tests', 'HveSquad.AgentFramework.Tests', 'HveSquad.AgentFramework.Tests.csproj')
          $Results = [IO.Path]::Combine($PWD.Path, 'artifacts', 'release-sync')
          $env:HVE_SQUAD_OBSERVATION_OUTPUT = [IO.Path]::Combine($Results, 'observations')
          $env:HVE_SQUAD_TEST_POWERSHELL = (Get-Command pwsh).Source
          dotnet test $Project --configuration Release --no-build --no-restore --results-directory $Results --logger 'trx;LogFileName=candidate.trx' --logger 'console;verbosity=minimal' -- xUnit.MaxParallelThreads=4
          if ($LASTEXITCODE -ne 0) { throw 'Full native regressions or candidate release cases failed.' }
          $Tool = [IO.Path]::Combine('tools', 'HveSquad.ReleaseSync')
          $ObsOut = [IO.Path]::Combine('compatibility', 'observations', "$($env:HVE_SQUAD_RELEASE_VERSION).json")
          dotnet run --project $Tool --configuration Release --no-build -- capture-observations --observations $env:HVE_SQUAD_OBSERVATION_OUTPUT --output $ObsOut
          if ($LASTEXITCODE -ne 0) { throw 'Observation capture failed.' }
      - name: Preserve exact legacy behavior
        shell: pwsh
        env:
          HVE_SQUAD_RELEASE_VERSION: 'v0.16.2'
          HVE_SQUAD_RELEASE_COMMIT: 'a941195c36dfb6181453f51ec4638b085ca3b3ad'
          HVE_SQUAD_REQUIRE_RELEASE_TESTS: 'true'
          HVE_SQUAD_RELEASE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_APM_PAT_MICROSOFT: ${{ github.token }}
          GITHUB_APM_PAT_PETER_N91: ${{ github.token }}
          APM_ALLOW_PROTOCOL_FALLBACK: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $Project = [IO.Path]::Combine('tests', 'HveSquad.AgentFramework.Tests', 'HveSquad.AgentFramework.Tests.csproj')
          $Results = [IO.Path]::Combine($PWD.Path, 'artifacts', 'release-sync')
          $env:HVE_SQUAD_OBSERVATION_OUTPUT = ''
          $env:HVE_SQUAD_TEST_POWERSHELL = (Get-Command pwsh).Source
          dotnet test $Project --configuration Release --no-build --no-restore --filter 'Category=ReleaseCompatibility' --results-directory $Results --logger 'trx;LogFileName=legacy.trx' --logger 'console;verbosity=minimal' -- xUnit.MaxParallelThreads=4
          if ($LASTEXITCODE -ne 0) { throw 'Required exact legacy cases failed.' }
          [xml]$Report = Get-Content -LiteralPath ([IO.Path]::Combine($Results, 'legacy.trx')) -Raw
          $Counters = $Report.TestRun.ResultSummary.Counters
          if ([int]$Counters.total -lt 13 -or $Counters.total -ne $Counters.executed -or $Counters.total -ne $Counters.passed) {
            throw 'Legacy acceptance requires all thirteen actual cases, without skips or empty reports.'
          }
      - name: Execute the isolated actual-package consumer and verify conformance
        shell: pwsh
        env:
          HVE_SQUAD_RELEASE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_APM_PAT_MICROSOFT: ${{ github.token }}
          APM_ALLOW_PROTOCOL_FALLBACK: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $Work = Join-Path $env:RUNNER_TEMP ("hve-squad-align-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $Script = [IO.Path]::Combine($PWD.Path, 'scripts', 'Test-PackageConsumer.ps1')
          & (Get-Command pwsh).Source -NoProfile -File $Script -WorkRoot $Work
          if ($LASTEXITCODE -ne 0) { throw 'Isolated package consumer verification failed.' }
          $Results = [IO.Path]::Combine($PWD.Path, 'artifacts', 'release-sync')
          $Package = Join-Path $Results 'package-evidence.json'
          Copy-Item -LiteralPath (Join-Path $Work 'package-evidence.json') -Destination $Package
          $Tool = [IO.Path]::Combine('tools', 'HveSquad.ReleaseSync')
          $Trx = Join-Path $Results 'candidate.trx'
          dotnet run --project $Tool --configuration Release --no-build -- verify-conformance --trx $Trx --package-proof $Package --output (Join-Path $Results 'conformance.json')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate conformance verification failed.' }
          dotnet run --project $Tool --configuration Release --no-build -- verify --trx $Trx --package-proof $Package --output (Join-Path $Results 'verification.json')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate reviewed contract verification failed.' }
      - name: Set up documentation tooling
        if: matrix.platform == 'linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate and build both documentation languages
        if: matrix.platform == 'linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Documentation dependency restore failed.' }
          npm run docs:test
          if ($LASTEXITCODE -ne 0) { throw 'Bilingual documentation contracts failed.' }
          npm run docs:build
          if ($LASTEXITCODE -ne 0) { throw 'Localized documentation and search build failed.' }
      - name: Upload captured Linux observation baseline
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aligned-observations
          path: compatibility/observations/*.json
          if-no-files-found: error
          retention-days: 30

  propose:
    needs: [evaluate, validate]
    if: >-
      always() &&
      needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.action == 'candidate' &&
      (needs.validate.result == 'success' || needs.validate.result == 'failure' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evaluation
          path: artifacts/release-sync
      - name: Download verified observation baseline when validation passed
        if: needs.evaluate.outputs.alignment_mode == 'prepared' && needs.validate.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aligned-observations
          path: compatibility/observations
      - name: Open or observe the one exact candidate proposal
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HVE_SQUAD_AUTOMATION_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          ALIGNMENT_MODE: ${{ needs.evaluate.outputs.alignment_mode }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Tool = [IO.Path]::Combine('tools', 'HveSquad.ReleaseSync')
          $Report = [IO.Path]::Combine('artifacts', 'release-sync', 'report.json')
          $Output = [IO.Path]::Combine('artifacts', 'release-sync', 'proposal.json')
          dotnet build $Tool --configuration Release --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'ReleaseSync build failed before proposal.' }
          $ProposalArgs = @('propose', '--allow-write', '--supersede-stale', '--repository', $env:TARGET_REPOSITORY, '--report', $Report, '--output', $Output)
          if ($env:ALIGNMENT_MODE -eq 'prepared' -and $env:VALIDATE_RESULT -eq 'success') {
            $PrepOut = [IO.Path]::Combine('artifacts', 'release-sync', 'propose-prep.json')
            dotnet run --project $Tool --configuration Release --no-build -- prepare-alignment --report $Report --output $PrepOut
            if ($LASTEXITCODE -ne 0) { throw 'Alignment file preparation failed in propose job.' }
            $ProposalArgs += '--aligned'
          }
          dotnet run --project $Tool --configuration Release --no-build -- @ProposalArgs
          $ExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $Output) {
            $Result = Get-Content -LiteralPath $Output -Raw | ConvertFrom-Json
            "## Reviewed candidate proposal" >> $env:GITHUB_STEP_SUMMARY
            "State: $($Result.status). $($Result.diagnostic)" >> $env:GITHUB_STEP_SUMMARY
          }
          "Bot PR workflows may require a writer to select **Approve workflows to run** in the merge box unless HVE_SQUAD_AUTOMATION_TOKEN is configured. Missing, pending, failed or wrong-head checks block promotion." >> $env:GITHUB_STEP_SUMMARY
          if ($ExitCode -ne 0) { throw 'Proposal setup/status failed; inspect permissions, existing proposal and exact-head checks. No promotion was performed.' }
