name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '18 5 * * 2'

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Supply-chain assessment
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assess posture
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.json
          results_format: json
          # Public API/badge publication requires separate human approval.
          publish_results: false
      - name: Assessment summary (not a score threshold)
        if: always()
        run: |
          {
            echo "## OpenSSF Scorecard assessment"
            echo "Recommendations only; no minimum score and no code-scanning upload."
            echo "Public API publication is disabled. Artifacts follow repository visibility."
            if [[ -s scorecard-results.json ]]; then
              jq -r '"", "| Check | Score |", "| --- | ---: |",
                (.checks[] | "| \(.name) | \(.score) |")' scorecard-results.json
            else
              echo "The analyzer produced no report; inspect the analysis step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload assessment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-assessment
          path: scorecard-results.json
          if-no-files-found: warn
          retention-days: 30
