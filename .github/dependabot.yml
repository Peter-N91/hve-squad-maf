version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: nuget
    directory: /
    groups:
      microsoft-agents-ai:
        patterns:
          - Microsoft.Agents.AI*
      microsoft-extensions-configuration-di:
        patterns:
          - Microsoft.Extensions.Configuration*
          - Microsoft.Extensions.DependencyInjection*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
