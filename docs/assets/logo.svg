<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title desc">
  <title id="title">HVE Squad for Agent Framework</title>
  <desc id="desc">An original community emblem: three hollow squad nodes form a triangle inside a hexagon, surrounding a coordinator command chevron.</desc>
  <style>
    :root { --cp-bg: #fcfbf8; --cp-text: #242424; --cp-accent: #b11f4b; --cp-accent-fg: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --cp-bg: #292929; --cp-text: #dedede; --cp-accent: #fd8ea1; --cp-accent-fg: #1a1a1a; } }
    .badge { fill: var(--cp-bg); stroke: var(--cp-accent); }
    .links { fill: none; stroke: var(--cp-accent); }
    .node { fill: var(--cp-bg); stroke: var(--cp-text); }
    .core { fill: var(--cp-accent); }
    .command { fill: none; stroke: var(--cp-accent-fg); }
  </style>
  <polygon class="badge" points="32,3 55.1,16.5 55.1,47.5 32,61 8.9,47.5 8.9,16.5" stroke-width="2.5" stroke-linejoin="round"/>
  <path class="links" d="M32 16 18 44H46Z M32 16V31 M18 44 32 31 46 44" stroke-width="2" stroke-linejoin="round"/>
  <g class="node" stroke-width="2.5"><circle cx="32" cy="16" r="4.4"/><circle cx="18" cy="44" r="4.4"/><circle cx="46" cy="44" r="4.4"/></g>
  <circle class="core" cx="32" cy="31" r="7"/>
  <path class="command" d="m30 28 3.5 3-3.5 3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
